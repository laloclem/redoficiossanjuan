<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60">
  <defs>
    <!-- Gradiente naranja de acción -->
    <linearGradient id="navOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Gradiente metálico / celeste técnico -->
    <linearGradient id="navSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- ================= ISOTIPO COMPACTO (HEXÁGONO & RED) ================= -->
  <g transform="translate(6, 6)">
    <!-- Base hexagonal de unión (trazo grueso metálico) -->
    <path d="M 24 3 
             L 8 12 
             A 3 3 0 0 0 6 15 
             L 6 33 
             A 3 3 0 0 0 8 36 
             L 24 45 
             A 3 3 0 0 0 27 45 
             L 40 37.5" 
          fill="none" 
          stroke="url(#navSteel)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Vértice dinámico / Chispa (Naranja) -->
    <path d="M 27 3 
             L 40 10.5 
             A 3 3 0 0 1 42 13 
             L 42 26" 
          fill="none" 
          stroke="url(#navOrange)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Núcleo central de red -->
    <circle cx="24" cy="24" r="7" fill="#0D1B2A" stroke="url(#navSteel)" stroke-width="3"/>
    <circle cx="24" cy="24" r="2.8" fill="url(#navOrange)"/>
  </g>

  <!-- ================= TIPOGRAFÍA ================= -->
  <!-- RED DE OFICIOS -->
  <text x="66" y="30" 
        font-family="'Montserrat', system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="1.2" 
        fill="#FFFFFF">RED DE OFICIOS</text>

  <!-- Línea decorativa sutil -->
  <line x1="68" y1="42" x2="100" y2="42" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- SAN JUAN -->
  <text x="108" y="45" 
        font-family="'Montserrat', system-ui, -apple-system, sans-serif" 
        font-size="11" 
        font-weight="800" 
        letter-spacing="4.5" 
        fill="url(#navOrange)">SAN JUAN</text>

  <!-- Línea complementaria -->
  <line x1="205" y1="42" x2="280" y2="42" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
</svg>
