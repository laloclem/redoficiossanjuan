<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Gradiente para el Sol sanjuanino / Conexión -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gradiente metálico para herramientas -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e1dd"/>
      <stop offset="100%" stop-color="#778da9"/>
    </linearGradient>

    <!-- Sombra suave para el isotipo -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo estructurado -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)"/>

  <!-- Contenedor central (Isotipo) -->
  <g transform="translate(250, 195)" filter="url(#dropShadow)">
    <!-- Engranaje base (Oficios e Industria) -->
    <path d="M -24,-92 L 24,-92 L 20,-68 A 72,72 0 0 1 50,-50 L 73,-59 L 92,-24 L 74,-6 A 72,72 0 0 1 74,6 L 92,24 L 73,59 L 50,50 A 72,72 0 0 1 20,68 L 24,92 L -24,92 L -20,68 A 72,72 0 0 1 -50,50 L -73,59 L -92,24 L -74,6 A 72,72 0 0 1 -74,-6 L -92,-24 L -73,-59 L -50,-50 A 72,72 0 0 1 -20,-68 Z" 
          fill="none" stroke="url(#metalGrad)" stroke-width="8" stroke-linejoin="round" opacity="0.85"/>

    <!-- Rayos del Sol / Nodos de Red -->
    <g stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-75" x2="0" y2="-105"/>
      <line x1="53" y1="-53" x2="74" y2="-74"/>
      <line x1="75" y1="0" x2="105" y2="0"/>
      <line x1="53" y1="53" x2="74" y2="74"/>
      <line x1="0" y1="75" x2="0" y2="105"/>
      <line x1="-53" y1="53" x2="-74" y2="74"/>
      <line x1="-75" y1="0" x2="-105" y2="0"/>
      <line x1="-53" y1="-53" x2="-74" y2="-74"/>
    </g>

    <!-- Nodos perimetrales -->
    <circle cx="0" cy="-105" r="5" fill="#f59e0b"/>
    <circle cx="74" cy="-74" r="5" fill="#f59e0b"/>
    <circle cx="105" cy="0" r="5" fill="#f59e0b"/>
    <circle cx="74" cy="74" r="5" fill="#f59e0b"/>
    <circle cx="0" cy="105" r="5" fill="#f59e0b"/>
    <circle cx="-74" cy="74" r="5" fill="#f59e0b"/>
    <circle cx="-105" cy="0" r="5" fill="#f59e0b"/>
    <circle cx="-74" cy="-74" r="5" fill="#f59e0b"/>

    <!-- Llave fija estilizada (Herramienta central) -->
    <g transform="rotate(-45)">
      <rect x="-7" y="-48" width="14" height="96" rx="6" fill="url(#metalGrad)"/>
      <!-- Mandíbula superior -->
      <path d="M -18,-42 C -24,-65 24,-65 18,-42 L 8,-42 L 8,-28 L -8,-28 L -8,-42 Z" fill="url(#metalGrad)"/>
      <!-- Ojo inferior -->
      <circle cx="0" cy="45" r="14" fill="url(#metalGrad)"/>
      <circle cx="0" cy="45" r="7" fill="#1b263b"/>
    </g>

    <!-- Núcleo solar central -->
    <circle cx="0" cy="0" r="15" fill="url(#sunGrad)"/>
    <circle cx="0" cy="0" r="6" fill="#0d1b2a"/>
  </g>

  <!-- Tipografía -->
  <g text-anchor="middle" id="brand-text">
    <text x="250" y="375" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#f8fafc">
      RED DE OFICIOS
    </text>

    <!-- Divisor horizontal -->
    <line x1="170" y1="395" x2="330" y2="395" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

    <text x="250" y="425" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="8" 
          fill="#94a3b8">
      SAN JUAN
    </text>
  </g>
</svg>
